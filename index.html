<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Broj po broj – 021.rs</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f5f5f0;display:flex;justify-content:center;padding:12px;min-height:100vh}
  .wrap{width:100%;max-width:480px}
  header{text-align:center;padding:10px 0 6px}
  header h1{font-size:1.1rem;font-weight:700;color:#1a1a1a;letter-spacing:.5px}
  header p{font-size:.75rem;color:#666;margin-top:2px}
  #date-label{font-size:.7rem;color:#999;text-align:center;margin-bottom:8px}

  #grid-wrap{display:flex;justify-content:center;margin:8px 0}
  #grid{display:grid;gap:2px;background:#ccc;border:2px solid #999;border-radius:6px;overflow:hidden;touch-action:none;user-select:none}
  .cell{background:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;color:#333;position:relative;cursor:crosshair;transition:background .08s}
  .cell.numbered{font-size:.85rem;color:#1a1a1a}
  .cell.path{background:#d4eaff}
  .cell.active{background:#a8d4ff}
  .cell.complete{background:#b6f0c8}
  .cell.start{background:#ffe9a0}
  .cell.end{background:#ffd080}
  .cell svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

  #info{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:#555;padding:4px 2px;margin-bottom:6px}
  #moves-val{font-weight:700;color:#333}

  .btn-row{display:flex;gap:8px;margin:8px 0}
  .btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .15s}
  .btn:active{opacity:.75}
  #btn-reset{background:#e8e8e2;color:#333}
  #btn-hint{background:#d4eaff;color:#1a5a8a}

  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;justify-content:center;align-items:center}
  #overlay.show{display:flex}
  #modal{background:#fff;border-radius:16px;padding:28px 24px;text-align:center;max-width:300px;width:90%}
  #modal h2{font-size:1.5rem;margin-bottom:8px}
  #modal p{color:#555;font-size:.9rem;margin-bottom:16px}
  #modal .big{font-size:2.5rem;margin-bottom:4px}
  #share-btn{background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:.9rem;font-weight:600;cursor:pointer;width:100%}
  #play-again{background:#e8e8e2;color:#333;border:none;border-radius:8px;padding:10px 20px;font-size:.85rem;font-weight:600;cursor:pointer;width:100%;margin-top:8px}

  #status{text-align:center;padding:40px 20px;color:#777;font-size:.9rem}

  #played-msg{display:none;text-align:center;padding:20px;background:#fff;border-radius:10px;margin:8px 0}
  #played-msg h3{font-size:1rem;margin-bottom:6px}
  #played-msg p{font-size:.8rem;color:#666}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Broj po broj</h1>
    <p>Poveži brojeve — popuni sva polja</p>
  </header>
  <div id="date-label"></div>

  <div id="status">Učitavanje zagonetke…</div>

  <div id="game" style="display:none">
    <div id="info">
      <span>Potezi: <span id="moves-val">0</span></span>
      <span id="grid-size-label"></span>
      <span id="timer-val">0:00</span>
    </div>
    <div id="grid-wrap"><div id="grid"></div></div>
    <div class="btn-row">
      <button class="btn" id="btn-reset">↺ Resetuj</button>
      <button class="btn" id="btn-hint">💡 Pomoć</button>
    </div>
    <div id="played-msg">
      <h3>Već si rešio/la zagonetku danas!</h3>
      <p>Vrati se sutra za novu mozgalicu.</p>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="modal">
    <div class="big">🎉</div>
    <h2>Bravo!</h2>
    <p id="result-text">Rešio/la si zagonetku!</p>
    <button id="share-btn">Podeli rezultat</button>
    <button id="play-again">Igraj ponovo</button>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const PUZZLE_URL = 'https://raw.githubusercontent.com/langostrika/Broj-po-broj/main/puzzle.json';
const STORAGE_KEY = 'broj_po_broj_played';
// ─────────────────────────────────────────────────────────────────────────────

let puzzle = null, size = 5;
let path = [], dragging = false;
let moves = 0, startTime = null, timerInterval = null, hintsUsed = 0;

async function init() {
  const today = todayStr();
  document.getElementById('date-label').textContent = formatDate(today);

  try {
    const res = await fetch(PUZZLE_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    puzzle = await res.json();
  } catch(e) {
    document.getElementById('status').textContent = 'Nema dostupne zagonetke. Probaj sutra!';
    return;
  }

  const played = getPlayed();
  document.getElementById('status').style.display = 'none';
  document.getElementById('game').style.display = '';
  size = puzzle.grid_size;
  document.getElementById('grid-size-label').textContent = size + '×' + size;
  buildGrid();

  if (played && played.date === puzzle.date) {
    renderSolution(played.solution);
    document.getElementById('played-msg').style.display = 'block';
    return;
  }

  startTimer();
}

function todayStr() { return new Date().toISOString().slice(0,10); }
function formatDate(s) {
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('sr-Latn-RS', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function getPlayed() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; } }
function savePlayed(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function buildGrid() {
  const g = document.getElementById('grid');
  const vw = Math.min(window.innerWidth - 40, 440);
  const cellSize = Math.floor((vw - (size-1)*2 - 4) / size);
  g.style.gridTemplateColumns = `repeat(${size}, ${cellSize}px)`;
  g.style.gridTemplateRows = `repeat(${size}, ${cellSize}px)`;
  g.innerHTML = '';
  const numbers = puzzle.numbers;
  const maxN = Math.max(...numbers.map(n => n.n));
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r; cell.dataset.c = c;
      const num = numbers.find(n => n.r === r && n.c === c);
      if (num) {
        cell.textContent = num.n;
        cell.classList.add('numbered');
        if (num.n === 1) cell.classList.add('start');
        if (num.n === maxN) cell.classList.add('end');
      }
      g.appendChild(cell);
    }
  }
  attachEvents();
}

function getCell(r, c) { return document.querySelector(`[data-r="${r}"][data-c="${c}"]`); }
function adjacent(a, b) { return Math.abs(a.r-b.r) + Math.abs(a.c-b.c) === 1; }
function inPath(r, c) { return path.some(p => p.r===r && p.c===c); }
function pathIndexOf(r, c) { return path.findIndex(p => p.r===r && p.c===c); }

function getCurrentSeqNum() {
  let maxN = 0;
  for (const p of path) {
    const n = puzzle.numbers.find(n => n.r===p.r && n.c===p.c);
    if (n && n.n > maxN) maxN = n.n;
  }
  return maxN;
}

function isValidNext(r, c) {
  if (r<0||r>=size||c<0||c>=size) return false;
  if (inPath(r,c)) return false;
  const last = path[path.length-1];
  if (!adjacent(last,{r,c})) return false;
  const num = puzzle.numbers.find(n => n.r===r && n.c===c);
  if (num) {
    const currentSeq = getCurrentSeqNum();
    if (num.n !== currentSeq+1) return false;
  }
  return true;
}

function startPath(r, c) {
  const num = puzzle.numbers.find(n => n.r===r && n.c===c);
  if (!num || num.n !== 1) return;
  path = [{r,c}];
  moves++;
  document.getElementById('moves-val').textContent = moves;
  renderPath();
}

function extendPath(r, c) {
  if (!path.length) return;
  const idx = pathIndexOf(r, c);
  if (idx !== -1) { path = path.slice(0, idx+1); renderPath(); return; }
  if (!isValidNext(r,c)) return;
  path.push({r,c});
  renderPath();
  checkWin();
}

function renderPath() {
  document.querySelectorAll('.cell').forEach(el => {
    el.classList.remove('path','active','complete','error');
    el.querySelectorAll('svg').forEach(s => s.remove());
  });
  for (let i=0; i<path.length; i++) {
    const {r,c} = path[i];
    const el = getCell(r,c);
    if (!el) continue;
    if (i===path.length-1) el.classList.add('active');
    else el.classList.add('path');
    drawConnectors(el,r,c,i);
  }
}

function drawConnectors(el, r, c, i) {
  const prev = i>0 ? path[i-1] : null;
  const next = i<path.length-1 ? path[i+1] : null;
  if (!prev && !next) return;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 10 10');
  const line = (x1,y1,x2,y2) => {
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);
    l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke','#5aabff');l.setAttribute('stroke-width','3');
    l.setAttribute('stroke-linecap','round');
    svg.appendChild(l);
  };
  const cx=5,cy=5;
  if (prev) { const dr=r-prev.r,dc=c-prev.c; line(cx,cy,cx-dc*5,cy-dr*5); }
  if (next) { const dr=next.r-r,dc=next.c-c; line(cx,cy,cx+dc*5,cy+dr*5); }
  el.appendChild(svg);
}

function checkWin() {
  if (path.length !== size*size) return;
  const last = path[path.length-1];
  const maxN = Math.max(...puzzle.numbers.map(n=>n.n));
  const lastNum = puzzle.numbers.find(n=>n.r===last.r&&n.c===last.c);
  if (!lastNum || lastNum.n !== maxN) return;
  path.forEach(({r,c}) => getCell(r,c).classList.add('complete'));
  stopTimer();
  const elapsed = timerVal();
  savePlayed({ date: puzzle.date, solution: path, moves, time: elapsed, hints: hintsUsed });
  setTimeout(() => showWin(elapsed), 400);
}

function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(() => {
    document.getElementById('timer-val').textContent = timerVal();
  }, 1000);
}
function stopTimer() { clearInterval(timerInterval); }
function timerVal() {
  const s = Math.floor((Date.now()-startTime)/1000);
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}

function attachEvents() {
  const grid = document.getElementById('grid');
  grid.addEventListener('mousedown', e => {
    const cell = e.target.closest('.cell'); if (!cell) return;
    dragging=true; path=[];
    startPath(+cell.dataset.r, +cell.dataset.c);
  });
  grid.addEventListener('mousemove', e => {
    if (!dragging) return;
    const cell = e.target.closest('.cell'); if (!cell) return;
    extendPath(+cell.dataset.r, +cell.dataset.c);
  });
  document.addEventListener('mouseup', () => { dragging=false; });

  grid.addEventListener('touchstart', e => {
    e.preventDefault();
    const t=e.touches[0];
    const cell=document.elementFromPoint(t.clientX,t.clientY)?.closest('.cell'); if(!cell) return;
    dragging=true; path=[];
    startPath(+cell.dataset.r, +cell.dataset.c);
  },{passive:false});
  grid.addEventListener('touchmove', e => {
    e.preventDefault(); if(!dragging) return;
    const t=e.touches[0];
    const cell=document.elementFromPoint(t.clientX,t.clientY)?.closest('.cell'); if(!cell) return;
    extendPath(+cell.dataset.r, +cell.dataset.c);
  },{passive:false});
  grid.addEventListener('touchend', () => { dragging=false; });

  document.getElementById('btn-reset').addEventListener('click', () => { path=[]; renderPath(); });
  document.getElementById('btn-hint').addEventListener('click', () => {
    hintsUsed++;
    const sol = puzzle.solution;
    const step = Math.min(path.length, sol.length-1);
    const hint = sol[step];
    const el = getCell(hint.r, hint.c);
    if (el) { el.style.outline='3px solid #f90'; setTimeout(()=>el.style.outline='',1200); }
  });
}

function showWin(elapsed) {
  document.getElementById('overlay').classList.add('show');
  document.getElementById('result-text').textContent =
    `Vreme: ${elapsed} · Potezi: ${moves}${hintsUsed?' · Pomoći: '+hintsUsed:''}`;
  document.getElementById('share-btn').onclick = () => {
    const txt = `Broj po broj 021.rs\n${formatDate(puzzle.date)}\n⏱ ${elapsed} | ${moves} potez${moves===1?'':'a'}${hintsUsed?' | 💡 '+hintsUsed:''}\nhttps://021.rs`;
    if (navigator.share) navigator.share({text:txt});
    else { navigator.clipboard.writeText(txt); alert('Kopirano!'); }
  };
  document.getElementById('play-again').onclick = () => {
    document.getElementById('overlay').classList.remove('show');
    path=[]; moves=0; hintsUsed=0;
    document.getElementById('moves-val').textContent=0;
    renderPath(); startTimer();
  };
}

function renderSolution(sol) {
  path=sol; renderPath();
  path.forEach(({r,c}) => getCell(r,c)?.classList.add('complete'));
}

init();
</script>
</body>
</html>
